sudo: required
services:
  - docker

before_install:
  - docker build -t emma/react-test -f ./client/Dockerfile.dev ./client

script:
  - docker run -e CI=true emma/react-test npm test

after_success:
  - docker build -t emma/multi-client ./client
  - docker build -t emma/multi-nginx ./nginx
  - docker build -t emma/multi-server ./server
  - docker build -t emma/multi-worker ./worker
